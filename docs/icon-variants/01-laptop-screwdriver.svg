<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Laptop and screwdriver</title>
  <desc id="desc">A laptop with a check mark on screen and a screwdriver crossing its base.</desc>
  <defs>
