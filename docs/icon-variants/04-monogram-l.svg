<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">LucioTech monogram</title>
  <desc id="desc">A geometric letter L joined by circuit traces and nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E2D"/>
      <stop offset="1" stop-color="#124356"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55E3AA"/>
      <stop offset="1" stop-color="#2FB98A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD070"/>
      <stop offset="1" stop-color="#F0A33A"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <path d="M192 116 V74 H310" fill="none" stroke="url(#mint)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="310" cy="74" r="16" fill="url(#amber)"/>
  <path d="M352 340 H406 V298" fill="none" stroke="url(#mint)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="406" cy="298" r="14" fill="#F5FAFC"/>

  <rect x="150" y="112" width="76" height="266" rx="26" fill="#F5FAFC"/>
  <rect x="150" y="302" width="202" height="76" rx="26" fill="#F5FAFC"/>
  <circle cx="188" cy="340" r="11" fill="url(#amber)"/>
</svg>
