<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Service checklist</title>
  <desc id="desc">A clipboard with three completed checks, representing the service order workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1E2D"/>
      <stop offset="1" stop-color="#124356"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55E3AA"/>
      <stop offset="1" stop-color="#2FB98A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD070"/>
      <stop offset="1" stop-color="#F0A33A"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <rect x="132" y="100" width="248" height="320" rx="28" fill="#F5FAFC"/>
  <rect x="204" y="76" width="104" height="54" rx="20" fill="url(#amber)"/>
  <rect x="228" y="94" width="56" height="18" rx="9" fill="#0B2333" opacity="0.35"/>

  <g>
    <circle cx="180" cy="190" r="20" fill="url(#mint)"/>
    <path d="M170 190 L177 197 L192 181" fill="none" stroke="#0B2333" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="216" y="180" width="122" height="20" rx="10" fill="#A9C1CC"/>

    <circle cx="180" cy="262" r="20" fill="url(#mint)"/>
    <path d="M170 262 L177 269 L192 253" fill="none" stroke="#0B2333" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="216" y="252" width="100" height="20" rx="10" fill="#A9C1CC"/>

    <circle cx="180" cy="334" r="20" fill="url(#mint)"/>
    <path d="M170 334 L177 341 L192 325" fill="none" stroke="#0B2333" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="216" y="324" width="74" height="20" rx="10" fill="#A9C1CC"/>
  </g>
</svg>
